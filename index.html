<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style/style.css" />
    <script src="https://kit.fontawesome.com/2d676e8f7d.js" crossorigin="anonymous"></script>
    <script type="module" src="src/js/main.js"></script>
    <title>Machine Dash</title>
  </head>
  <body>
    <header class="header">
      <div class="header__container container">
        <h1 class="title">Machine Dash</h1>
        <div class="container-icons">
          <button class="icon-button" type="button" aria-label="Notificação">
            <i class="fa-regular fa-bell notification-icon" aria-hidden="true" title="Notificação"></i>
          </button>

          <button class="icon-button" type="button" aria-label="Perfil do Usuário">
            <i class="fa-regular fa-user user-icon" aria-hidden="true" title="Usuário"></i>
          </button>
        </div>
      </div>
    </header>
    <main class="dashboard__container container">
      <div class="dashboard__header">
        <div class="search__container">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input class="search__input" type="text" placeholder="Digite um motorista ou um cliente" id="search__input" />
        </div>
      </div>
      <section class="driver__container">
        <ul class="driver__list"></ul>
      </section>
      <template class="driver-card-template">
        <li class="driver__card">
          <header class="driver__header">
            <div class="driver__data">
              <h3 class="driver__id"></h3>
              <span class="driver__status"></span>
            </div>
            <span class="driver__price"></span>
          </header>

          <div class="driver__names">
            <p class="driver__driver">Motorista: <strong class="driver__driver-name"></strong></p>
            <p class="driver__client">Cliente: <strong class="driver__client-name"></strong></p>
          </div>

          <div class="driver__addresses">
            <p class="driver-card__address-group">
              <span class="driver-card__address-label">Origem:</span>
              <span class="driver__origin-text"></span>
            </p>
            <p class="driver-card__address-group">
              <span class="driver-card__address-label">Destino:</span>
              <span class="driver__destiny-text"></span>
            </p>
          </div>
        </li>
      </template>
      <aside class="driver__sidebar">
        <h2 class="sidebar__title">Estatísticas rápidas</h2>
        <article class="sidebar__panel">
          <ul class="sidebar__list">
            <li class="sidebar__item sidebar__item--all">
              <p class="sidebar__label">Corridas totais</p>
              <span class="sidebar__label-count sidebar__label-all" id="sidebar__label-all"></span>
            </li>
            <li class="sidebar__item sidebar__item--finalizada">
              <p class="sidebar__label">Finalizadas</p>
              <span class="sidebar__label-count sidebar__label-finalizada" id="sidebar__label-finalizada"></span>
            </li>
            <li class="sidebar__item sidebar__item--em_andamento">
              <p class="sidebar__label">Em andamento</p>
              <span class="sidebar__label-count sidebar__label-em_andamento" id="sidebar__label-em_andamento"></span>
            </li>
            <li class="sidebar__item sidebar__item--pendente">
              <p class="sidebar__label">Pendentes</p>
              <span class="sidebar__label-count sidebar__label-pendente" id="sidebar__label-pendente"></span>
            </li>
            <li class="sidebar__item sidebar__item--cancelada">
              <p class="sidebar__label">Canceladas</p>
              <span class="sidebar__label-count sidebar__label-cancelada" id="sidebar__label-cancelada"></span>
            </li>
          </ul>
        </article>
      </aside>
    </main>
  </body>
</html>
